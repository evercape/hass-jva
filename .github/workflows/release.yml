name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release_zip_file:
    name: Prepare release asset
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: ZIP the integration
        run: |
          cd ${{ github.workspace }}/custom_components/jva_electric_fence
          zip jva_electric_fence.zip -r ./ -x '*.pyc' -x '*__pycache__*' -x '*.zip'

      - name: Upload zip to release
        uses: softprops/action-gh-release@v2
        with:
          files: custom_components/jva_electric_fence/jva_electric_fence.zip
