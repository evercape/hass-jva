[project]
name = "jva-fence"
version = "0.1.0"
description = "Local test client for a JVA electric fence web controller"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12",
  "fastapi>=0.115",
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
jva-fence = "jva_fence.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jva_fence = ["static/*", "fixtures/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
